name: tests

on:
  push:
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU wheel first, so requirements.txt's torch pin is already satisfied
      # and pip does not pull the multi-GB CUDA build
      - run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # the offline suite only: no model downloads, no GPU
      - run: python run_all_tests.py
